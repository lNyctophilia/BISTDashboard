  <rect x="136" y="270" width="64" height="110" rx="10" fill="#EF4444"/>

  <!-- Klasik Yeşil Mum (Yükseliş) -->
  <line x1="256" y1="160" x2="256" y2="360" stroke="#22C55E" stroke-width="10" stroke-linecap="round"/>
  <rect x="224" y="190" width="64" height="130" rx="10" fill="#22C55E"/>

  <!-- Klasik Yeşil Mum (Güçlü Yükseliş) -->
  <line x1="344" y1="100" x2="344" y2="310" stroke="#22C55E" stroke-width="10" stroke-linecap="round"/>
  <rect x="312" y="130" width="64" height="130" rx="10" fill="#22C55E"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Midnight Base Gradient -->
    <linearGradient id="bist-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#07090E"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Glass Terminal Shield Gradient -->
    <linearGradient id="bist-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Outer Cyber Neon Ring Gradient (2 SVG Fusion: Terminal Tech + Market Growth) -->
    <linearGradient id="bist-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Bull Surge Trendline Gradient -->
    <linearGradient id="bist-trend" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="75%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Area Glow under Trend Curve -->
    <linearGradient id="bist-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Candlestick Gradients -->
    <linearGradient id="candle-bull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="candle-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Glow Filter Effects -->
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="glow-intense" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ambient Backlight Gradient -->
    <radialGradient id="ambient-cyan" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-green" cx="80%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Background Tile with Rounded Squircle Shape -->
  <rect width="512" height="512" rx="112" fill="url(#bist-bg)"/>
  
  <!-- Ambient Glow Blobs -->
  <rect width="512" height="512" rx="112" fill="url(#ambient-cyan)"/>
  <rect width="512" height="512" rx="112" fill="url(#ambient-green)"/>

  <!-- 2. Cyber Shield Glass Body (Concept 1: Modern Terminal Container) -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="url(#bist-shield)" stroke="url(#bist-ring)" stroke-width="5" stroke-opacity="0.8" filter="url(#glow-soft)"/>

  <!-- Terminal Grid Matrix Accent Lines -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="80" y1="130" x2="432" y2="130"/>
    <line x1="80" y1="200" x2="432" y2="200"/>
    <line x1="80" y1="270" x2="432" y2="270"/>
    <line x1="80" y1="340" x2="432" y2="340"/>
    <line x1="80" y1="410" x2="432" y2="410"/>
    
    <line x1="140" y1="80" x2="140" y2="432"/>
    <line x1="220" y1="80" x2="220" y2="432"/>
    <line x1="300" y1="80" x2="300" y2="432"/>
    <line x1="380" y1="80" x2="380" y2="432"/>
  </g>

  <!-- 3. Stock Market Candlesticks (Concept 2: BIST Financial Chart Dynamics) -->
  <!-- Candle 1: Foundation Blue -->
  <line x1="140" y1="270" x2="140" y2="385" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
  <rect x="131" y="295" width="18" height="60" rx="4" fill="url(#candle-blue)" stroke="#93C5FD" stroke-width="1"/>

  <!-- Candle 2: Growth Emerald -->
  <line x1="215" y1="210" x2="215" y2="355" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
  <rect x="205" y="235" width="20" height="90" rx="4" fill="url(#candle-bull)" stroke="#6EE7B7" stroke-width="1"/>

  <!-- Candle 3: Bull Surge -->
  <line x1="290" y1="150" x2="290" y2="310" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="279" y="175" width="22" height="110" rx="4" fill="url(#candle-bull)" stroke="#A7F3D0" stroke-width="1.2"/>

  <!-- Candle 4: Peak Breakout -->
  <line x1="365" y1="100" x2="365" y2="250" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>
  <rect x="354" y="125" width="22" height="95" rx="4" fill="url(#candle-bull)" stroke="#A7F3D0" stroke-width="1.5" filter="url(#glow-soft)"/>

  <!-- 4. Trend Line Glow Fill Area under Curve -->
  <path d="M 90 380 Q 140 360 175 320 T 260 230 T 350 155 L 425 105 L 425 415 L 90 415 Z" fill="url(#bist-area)"/>

  <!-- 5. Main Upward Trend Surge Curve -->
  <path d="M 90 380 C 130 370, 145 330, 175 320 C 210 305, 220 250, 260 230 C 295 210, 315 170, 350 150 C 375 135, 395 110, 425 102" fill="none" stroke="url(#bist-trend)" stroke-width="10" stroke-linecap="round" filter="url(#glow-intense)"/>

  <!-- 6. Arrow & Star Sparkle (BIST Breakout Beacon) -->
  <path d="M 396 100 L 426 100 L 426 130" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-soft)"/>

  <!-- Star Emblem Accent at Top Right Peak -->
  <g transform="translate(426, 100)">
    <path d="M 0 -20 Q 0 0 20 0 Q 0 0 0 20 Q 0 0 -20 0 Q 0 0 0 -20 Z" fill="#FACC15" filter="url(#glow-soft)"/>
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Crescent Arc Detail (Turkish Market Heritage Ring Segment) -->
  <path d="M 110 145 A 180 180 0 0 0 280 405" fill="none" stroke="url(#bist-ring)" stroke-width="3.5" stroke-dasharray="8 10" opacity="0.35"/>
</svg>

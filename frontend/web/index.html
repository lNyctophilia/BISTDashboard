<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BIST Dashboard">

  <!-- Theme Color & PWA Splash Screen Color matching dark theme -->
  <meta name="theme-color" content="#07090e">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07090e">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#07090e">
  <meta name="msapplication-TileColor" content="#07090e">
  <meta name="msapplication-navbutton-color" content="#07090e">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BIST Dashboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <title>BIST Dashboard</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #07090e !important;
      margin: 0;
      padding: 0;
    }
  </style>

  <!-- Mobile Responsive Viewport Fix -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Instant Authentication Check (Prevents any login screen flash on startup when remembered) -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('bist_auth') === 'true' || localStorage.getItem('bist_remember_auth') === 'true') {
          document.documentElement.classList.add('bist-authenticated');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Modern Glassmorphism Login Styles -->
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <!-- Modern Glassmorphism Login Screen Overlay -->
  <div id="login-screen">
    <div class="auth-ambient-glow auth-ambient-1"></div>
    <div class="auth-ambient-glow auth-ambient-2"></div>

    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <h1 class="auth-title">BIST Terminal</h1>
        <p class="auth-subtitle">Erişim sağlamak için şifrenizi girin</p>
      </div>

      <div id="auth-error" class="auth-error-banner"></div>

      <form id="auth-form" class="auth-form" autocomplete="off" onsubmit="return false;">
        <div class="auth-input-group">
          <label class="auth-label" for="auth-password">Geliştirici Şifresi</label>
          <div class="auth-input-wrapper">
            <input type="password" id="auth-password" class="auth-input" placeholder="••••••••" required autofocus autocomplete="current-password">
            <button type="button" id="auth-toggle-pwd" class="auth-eye-btn" title="Şifreyi Göster/Gizle" tabIndex="-1">
              <svg id="auth-eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-remember-row">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="auth-remember" checked>
            <span>Beni Hatırla</span>
          </label>
        </div>

        <button type="submit" id="auth-submit" class="auth-submit-btn">
          <span>Giriş Yap</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
        <span>256-Bit SHA Encrypted Secure Access</span>
      </div>
    </div>
  </div>

  <!-- Load Auth Configuration (Gitignored file first, fallback to example if not present) -->
  <script src="auth-config.js" onerror="this.onerror=null;this.src='auth-config.example.js';"></script>
  <!-- Load Auth Logic -->
  <script src="login.js"></script>

  <!-- Flutter Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: GitHub Pages Otomatik Yayınlama

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Bağımlılıkları Yükle
        run: |
          cd frontend
          flutter pub get

      - name: Flutter Web Derle
        run: |
          cd frontend
          flutter build web --release --base-href "/BISTDashboard/" --dart-define=API_URL="https://bistdashboard-9pag.onrender.com/api"

      - name: Auth Config Kontrolü
        run: |
          if [ ! -f "frontend/build/web/auth-config.js" ]; then
            echo "auth-config.js bulunamadı, auth-config.example.js kopyalanıyor..."
            cp frontend/web/auth-config.example.js frontend/build/web/auth-config.js
          fi

      - name: gh-pages Dalına Push Et
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build/web
          force_orphan: true

      - name: Pages Artifact Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/build/web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'a Yayınla
        id: deployment
        uses: actions/deploy-pages@v4

name: GitHub Pages Otomatik Yayınlama

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Bağımlılıkları Yükle
        run: |
          cd frontend
          flutter pub get

      - name: Flutter Web Derle
        run: |
          cd frontend
          flutter build web --release --base-href "/Finance/"

      - name: Auth Config Kontrolü
        run: |
          if [ ! -f "frontend/build/web/auth-config.js" ]; then
            echo "auth-config.js bulunamadı, auth-config.example.js kopyalanıyor..."
            cp frontend/web/auth-config.example.js frontend/build/web/auth-config.js
          fi

      - name: GitHub Pages'a Yayınla
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build/web
          force_orphan: true
